name: Keep-Alive

on:
  schedule:
    # Every 3 days at 06:00 UTC — prevents Supabase free tier from pausing
    - cron: "0 6 */3 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app health endpoint (keeps Supabase connection active)
        run: |
          curl -sf "${{ secrets.APP_URL }}/api/health" \
            && echo "Health OK" \
            || echo "Health check failed (non-blocking)"
        continue-on-error: true

      - name: Warm HuggingFace model (prevents cold-start during demo)
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"inputs":"test email warmup","parameters":{"candidate_labels":["phishing","legitimate"]}}' \
            "https://api-inference.huggingface.co/models/facebook/bart-large-mnli" \
            && echo "HuggingFace warm OK" \
            || echo "HuggingFace warm failed (non-blocking)"
        continue-on-error: true
